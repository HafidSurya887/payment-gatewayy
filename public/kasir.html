<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Kasirku</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  body { font-family: system-ui, sans-serif; background:#0f1115; color:#eee; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; }
  .card { background:#161a22; border-radius:16px; padding:28px; width:320px; text-align:center; box-shadow:0 8px 24px rgba(0,0,0,.4); }
  input { width:100%; padding:10px; margin-bottom:12px; border-radius:8px; border:1px solid #333; background:#0f1115; color:#eee; box-sizing:border-box; font-size:16px; }
  button { width:100%; padding:12px; border:0; border-radius:8px; background:#22c55e; color:#08210f; font-weight:700; font-size:16px; cursor:pointer; }
  img.qr { width:220px; height:220px; margin:16px 0; border-radius:8px; background:#fff; padding:8px; }
  .status { font-weight:700; font-size:18px; margin-top:8px; }
  .pending { color:#f59e0b; }
  .success { color:#22c55e; }
  .order-id { font-size:12px; color:#888; margin-top:10px; word-break:break-all; }
  .order-id b { color:#ccc; }
</style>
</head>
<body>
  <div class="card">
    <h2>Kasirku</h2>
    <input id="amount" type="number" placeholder="Nominal, mis. 50000" />
    <button onclick="buatQR()">Request QR</button>

    <div id="hasil" style="display:none">
      <img id="qrImg" class="qr" />
      <div>Bayar sesuai nominal PERSIS:</div>
      <div id="nominalUnik" style="font-size:20px; font-weight:700;"></div>
      <div id="status" class="status pending">Menunggu pembayaran...</div>
      <div class="order-id">Order ID: <b id="orderIdText"></b></div>
    </div>
  </div>

<script>
let currentOrderId = null;
let pollTimer = null;

async function buatQR() {
  const amount = document.getElementById('amount').value;
  if (!amount) return alert('Isi nominal dulu');

  const res = await fetch('/generate-qr', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ amount }),
  });
  const data = await res.json();
  if (data.error) return alert(data.error);

  currentOrderId = data.orderId;
  document.getElementById('orderIdText').innerText = data.orderId;
  document.getElementById('qrImg').src = data.qrImage;
  document.getElementById('nominalUnik').innerText = 'Rp' + data.uniqueAmount.toLocaleString('id-ID');
  document.getElementById('status').innerText = 'Menunggu pembayaran...';
  document.getElementById('status').className = 'status pending';
  document.getElementById('hasil').style.display = 'block';

  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(cekStatus, 3000);
}

async function cekStatus() {
  if (!currentOrderId) return;
  const res = await fetch('/status/' + currentOrderId);
  const data = await res.json();
  if (data.status === 'success') {
    document.getElementById('status').innerText = 'LUNAS!';
    document.getElementById('status').className = 'status success';
    clearInterval(pollTimer);
  }
}
</script>
</body>
</html>
